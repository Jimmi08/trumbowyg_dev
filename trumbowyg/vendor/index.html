<!DOCTYPE html>
<html>

<head>

<!-- Include trumbo stylesheet -->

<link rel="stylesheet" href="ui/trumbowyg.min.css" />
<link rel="stylesheet" href="plugins/table/ui/trumbowyg.table.min.css" />

<!-- Style the toolbar container -->

<style>

.box {
  max-width: 1000px;
  height: 400px;
}

.trumbowyg-box svg, .trumbowyg-modal svg {
  width: 20px;
  height: 100%;
  color: #222;
  fill: #222;
}

:root {
    --tbw-cell-vertical-padding: 4px;
    --tbw-cell-horizontal-padding: 8px;
    --tbw-cell-line-height: 1.5em;
}

table {
    margin-bottom: var(--tbw-cell-line-height);
}

th,
td {
    height: calc(var(--tbw-cell-vertical-padding) * 2 + var(--tbw-cell-line-height));
    min-width: calc(var(--tbw-cell-horizontal-padding) * 2);
    padding: var(--tbw-cell-vertical-padding) var(--tbw-cell-horizontal-padding);
    border: 1px solid #e7eaec;
}

</style>

</head>



<body>


			
<!-- Create the editor container 
<div class="box">
<div id="trumbowyg-demo">
  <p>Hello World!</p>
  <p>Some initial <strong>bold</strong> text</p>
  <p><br /></p>
</div>
</div>

<div class="box">
<div id="trumbowyg-demosk">
  <p>Hello World! sk</p>
  <p>Some initial <strong>bold</strong> text</p>
  <p><br /></p>
</div>
</div>
-->

<div class="box">
<div id="trumbowyg-demotable">
  <p>Hello World! Table demo</p>
  <p>Some initial <strong>bold</strong> text</p>
  <p><br /></p>
</div>
</div>

<script src="vendors/jquery/jquery.min.js"></script>

<!-- Include the trumbo library <script>window.jQuery || document.write('<script src="js/vendor/jquery-3.3.1.min.js"><\/script>')</script> -->
<script src="trumbowyg.js"></script>

<!-- Import languages -->
<script type="text/javascript" src="langs/nl.min.js"></script>
<script type="text/javascript" src="langs/sk.min.js"></script>

<!-- Import plugins  
<script src="plugins/allowtagsfrompaste/trumbowyg.allowtagsfrompaste.min.js"></script>
allowTagsFromPaste: {
            allowedTags: ['h4', 'p', 'br']
        },
-->
<script src="plugins/template/trumbowyg.template.js"></script>
<script src="plugins/table/trumbowyg.table.min.js"></script>
<script src="plugins/base64/trumbowyg.base64.js"></script>
<script src="plugins/colors/trumbowyg.colors.js"></script>
<script src="plugins/noembed/trumbowyg.noembed.js"></script>
<script src="plugins/pasteimage/trumbowyg.pasteimage.js"></script>
<script src="plugins/preformatted/trumbowyg.preformatted.js"></script>

<script src="plugins/cleanpaste/trumbowyg.cleanpaste.min.js"></script>

<!-- Initialize Quill editor -->
<script>

$('#trumbowyg-demo').trumbowyg({
   
});

$('#trumbowyg-demosk').trumbowyg({
   lang: 'sk'
});

$('#trumbowyg-demotable').trumbowyg({
	lang: ['nl'],
    btns: [ 		['viewHTML'],
                    ['formatting'],
                    ['strong', 'em', 'underline', 'del'],
                    ['superscript', 'subscript'],
					['foreColor', 'backColor'],
                    ['link'],
                    ['insertImage'],
                    ['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'],
                    ['unorderedList', 'orderedList'],
                    ['horizontalRule'],
                    ['removeformat'],
					['upload', 'base64', 'noembed'],
                    ['table', 'tableCellBackgroundColor', 'tableBorderColor'],
					['preformatted'],
                    ['template'],
                    ['fullscreen']
					
       
    ],
    plugins: {
        table: {
            // Some table plugin options, see details below
        },
		
		templates: [
                        {
                            name: 'Template 1',
                            html: '<p>I am a template!</p>'
                        },
                        {
                            name: 'Template 2',
                            html: '<p>I am a different template!</p>'
                        }
                    ]

    }
});

</script>
</body>
